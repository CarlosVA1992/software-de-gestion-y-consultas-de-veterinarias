<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SGCV{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="mb-4">
        <a href="{% url 'clientes:registrar_ficha' %}" class="btn btn-primary btn-sm">Registrar ficha</a>
        <a href="{% url 'clientes:buscar_ficha' %}" class="btn btn-secondary btn-sm">Buscar ficha</a>
    </nav>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
